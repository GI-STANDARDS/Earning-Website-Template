<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Task Referral Platform</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/forms.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1>Create Account</h1>
      <p class="subtitle">Join and start earning today</p>

      <form id="register-form">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input 
              type="text" 
              id="firstName" 
              name="firstName" 
              placeholder="John" 
              required
            >
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input 
              type="text" 
              id="lastName" 
              name="lastName" 
              placeholder="Doe" 
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="your@email.com" 
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="At least 6 characters" 
            required
          >
          <div id="password-strength" class="password-strength" style="display: none;">
            <div class="strength-meter">
              <div id="strength-bar" class="strength-bar"></div>
            </div>
            <p id="strength-text" class="strength-text"></p>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input 
            type="password" 
            id="confirm-password" 
            name="confirm-password" 
            placeholder="Confirm your password" 
            required
          >
        </div>

        <div class="form-group checkbox">
          <input 
            type="checkbox" 
            id="terms" 
            name="terms" 
            required
          >
          <label for="terms">I agree to the Terms of Service</label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </div>

        <div class="form-links">
          <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
      </form>
    </div>
  </div>

  <!-- Loading Indicator -->
  <div id="loader" class="loader" style="display: none;">
    <div class="spinner"></div>
  </div>

  <script src="assets/js/global.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // Password strength indicator
    document.getElementById('password').addEventListener('input', (e) => {
      const password = e.target.value;
      const strength = validatePasswordStrength(password);
      const indicator = document.getElementById('password-strength');
      const bar = document.getElementById('strength-bar');
      const text = document.getElementById('strength-text');

      if (password) {
        indicator.style.display = 'block';
        bar.className = 'strength-bar';
        bar.classList.add(`strength-${strength.level}`);
        text.textContent = `Strength: ${strength.level.toUpperCase()}`;
      } else {
        indicator.style.display = 'none';
      }
    });

    // Form submission
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      // Validation
      if (password !== confirmPassword) {
        showNotification('Passwords do not match', 'error');
        return;
      }

      if (password.length < 6) {
        showNotification('Password must be at least 6 characters', 'error');
        return;
      }

      showLoading();
      try {
        await handleRegister(firstName, lastName, email, password);
      } catch (error) {
        console.error('Registration error:', error);
      } finally {
        hideLoading();
      }
    });
  </script>
</body>
</html>
